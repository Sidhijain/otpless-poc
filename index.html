<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <h1>OTP less authentication</h1>
    <div class="login-box">

    <input
        type="tel"
        id="mobileNumber"
        placeholder="Enter Mobile Number">

    <button id="verifyBtn">
        Verify using SNA
    </button>
    <div id="otpSection" style="display:none; margin-top:20px;">

        <input
            type="text"
            id="otpInput"
            placeholder="Enter OTP"
            maxlength="6"
            autocomplete="one-time-code">

        <button id="verifyOtpBtn">
            Verify OTP
        </button>

    </div>
    <div
    id="debugBox"
    style="
        margin-top:20px;
        padding:15px;
        border:1px solid #000;
        background:#f8f8f8;
        white-space:pre-wrap;
        word-break:break-word;
        font-size:14px;
    ">
    Waiting for events...
</div>
</div>
<script
    id="otpless-sdk"
    src="https://otpless.com/v5/headless.js"
    data-appid="K82YZQR9UYJ7416LF0TO">
</script>
<script>
window.addEventListener("load", () => {
    console.log("OTPless =", window.OTPless);
});
</script>
<script src="./js/app.js"></script>
</body>
</html>
