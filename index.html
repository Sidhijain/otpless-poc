<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>OTPLESS POC</title>

    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <div class="container">
      <div class="card">
        <img
          src="https://cdn-icons-png.flaticon.com/512/3059/3059518.png"
          class="logo"
          alt="OTP"
        />

        <h2>OTPLESS Authentication</h2>

        <p class="subtitle">Silent Network Authentication / OTP Verification</p>

        <input
          id="mobileNumber"
          type="tel"
          placeholder="Enter Mobile Number"
          maxlength="10"
        />

        <button id="verifyBtn">Verify</button>

        <div id="status" class="status">Waiting...</div>
      </div>
    </div>

    <script
      id="otpless-sdk"
      src="https://otpless.com/v4/headless.js"
      data-appid="K82YZQR9UYJ7416LF0TO"
    ></script>

    <script src="./js/app.js"></script>
  </body>
</html>
