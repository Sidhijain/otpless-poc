<!DOCTYPE html>
<html>
<body>

<h2>WebOTP Test</h2>

<script>
if ("OTPCredential" in window) {
    console.log("WebOTP supported");

    navigator.credentials.get({
        otp: { transport: ["sms"] }
    }).then(otp => {
        console.log("OTP RECEIVED");
        console.log(otp);
        alert(otp.code);
    }).catch(err => {
        console.error(err);
    });

} else {
    console.log("WebOTP NOT supported");
}
</script>

</body>
</html>
